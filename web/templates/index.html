<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KrakenD + Lua clientId routing demo</title>
  <style>
    :root {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    body {
      margin: 2rem;
      max-width: 980px;
    }

    h1 {
      margin: 0 0 0.25rem;
    }

    .rule {
      margin-bottom: 1rem;
      font-weight: 600;
      color: #1f2937;
    }

    .panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      font-size: 0.95rem;
      padding: 0.55rem 0.65rem;
    }

    textarea {
      min-height: 130px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .json-error {
      color: #b91c1c;
      font-size: 0.9rem;
      min-height: 1.2rem;
      margin-top: 0.35rem;
    }

    .actions {
      margin-top: 0.75rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .actions button {
      width: auto;
      min-width: 190px;
      cursor: pointer;
    }

    .service-badge {
      border-radius: 8px;
      color: #fff;
      padding: 0.7rem 0.9rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: #111827;
    }

    .badge-a {
      background: #6b7280;
    }

    .badge-b {
      background: #2563eb;
    }

    .badge-c {
      background: #16a34a;
    }

    .badge-unknown {
      background: #111827;
    }

    pre,
    #debug {
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.75rem;
      min-height: 4rem;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 0.35rem;
    }

    #debug {
      background: #0f172a;
      color: #e5e7eb;
      border-color: #334155;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.86rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    th,
    td {
      text-align: left;
      border-bottom: 1px solid #eee;
      padding: 0.55rem 0.65rem;
      font-size: 0.93rem;
      vertical-align: top;
    }

    th {
      background: #f5f5f5;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }
  </style>
</head>
<body>
  <h1>KrakenD + Lua clientId routing demo</h1>
  <div class="rule">clientId 1..6 -> svc_c, other -> svc_b</div>

  <div class="panel">
    <div class="controls">
      <div>
        <label for="clientId">clientId</label>
        <input id="clientId" type="number" step="1" min="1" placeholder="clientId" value="3" />
      </div>

      <div>
        <label for="operation">Operation</label>
        <select id="operation">
          <option value="hello">GET /hello</option>
          <option value="echo">POST /echo</option>
        </select>
      </div>
    </div>

    <div id="jsonPanel" class="hidden">
      <label for="jsonBody">JSON body (POST /echo only)</label>
      <textarea id="jsonBody">{
  "demo": true,
  "source": "web-ui",
  "message": "Hello world"
}</textarea>
      <div id="jsonError" class="json-error"></div>
    </div>

    <div class="actions">
      <button id="sendBtn" type="button">Send</button>
      <button id="openRedirectBtn" type="button">Open real redirect</button>
      <button id="batchBtn" type="button">Send 10 sequential requests</button>
    </div>
  </div>

  <div id="serviceBadge" class="service-badge badge-unknown">Service: unknown</div>

  <h2>Step1 - /api/route_decision response</h2>
  <pre id="step1">No request yet</pre>

  <h2>Step2 - final service response</h2>
  <pre id="step2">No request yet</pre>

  <h2>Debug</h2>
  <div id="debug">No debug logs yet</div>

  <h2>Batch Result (10 requests)</h2>
  <table>
    <thead>
      <tr>
        <th>clientId</th>
        <th>target</th>
        <th>service</th>
      </tr>
    </thead>
    <tbody id="batchBody"></tbody>
  </table>

  <script>
    const clientIdEl = document.getElementById("clientId");
    const operationEl = document.getElementById("operation");
    const jsonPanelEl = document.getElementById("jsonPanel");
    const jsonBodyEl = document.getElementById("jsonBody");
    const jsonErrorEl = document.getElementById("jsonError");

    const sendBtn = document.getElementById("sendBtn");
    const openRedirectBtn = document.getElementById("openRedirectBtn");
    const batchBtn = document.getElementById("batchBtn");

    const step1El = document.getElementById("step1");
    const step2El = document.getElementById("step2");
    const batchBodyEl = document.getElementById("batchBody");
    const serviceBadgeEl = document.getElementById("serviceBadge");
    const debugEl = document.getElementById("debug");

    function appendDebug(message) {
      const timestamp = new Date().toISOString();
      if (debugEl.textContent === "No debug logs yet") {
        debugEl.textContent = "";
      }
      debugEl.textContent += `[${timestamp}] ${message}\n`;
    }

    function safeFetch(url, init) {
      return fetch(url, {
        cache: "no-store",
        credentials: "same-origin",
        ...init
      });
    }

    function setBadge(service) {
      serviceBadgeEl.classList.remove("badge-a", "badge-b", "badge-c", "badge-unknown");
      if (service === "A") {
        serviceBadgeEl.classList.add("badge-a");
      } else if (service === "B") {
        serviceBadgeEl.classList.add("badge-b");
      } else if (service === "C") {
        serviceBadgeEl.classList.add("badge-c");
      } else {
        serviceBadgeEl.classList.add("badge-unknown");
      }
      serviceBadgeEl.textContent = `Service: ${service || "unknown"}`;
    }

    function getOperation() {
      return operationEl.value === "echo" ? "echo" : "hello";
    }

    function updateOperationUI() {
      const postMode = getOperation() === "echo";
      jsonPanelEl.classList.toggle("hidden", !postMode);
      if (!postMode) {
        jsonErrorEl.textContent = "";
      }
    }

    function buildDecisionUrl(clientId, op) {
      const url = new URL("/api/route_decision", window.location.origin);
      url.searchParams.set("clientId", clientId);
      url.searchParams.set("op", op);
      return url.toString();
    }

    function buildRedirectUrl(clientId, op) {
      const url = new URL("/api/route", window.location.origin);
      url.searchParams.set("clientId", clientId);
      url.searchParams.set("op", op);
      return url.toString();
    }

    function buildServiceUrl(location, op) {
      const url = new URL(location, window.location.origin);
      if (op === "echo") {
        url.pathname = url.pathname.replace(/\/hello$/, "/echo");
      }
      return url.toString();
    }

    function parsePayloadIfNeeded(op) {
      if (op !== "echo") {
        return { ok: true, payload: null };
      }

      const raw = jsonBodyEl.value.trim();
      if (!raw) {
        const msg = "JSON body is required for POST /echo";
        jsonErrorEl.textContent = msg;
        appendDebug(`JSON parse error: ${msg}`);
        return { ok: false, error: msg };
      }

      try {
        const payload = JSON.parse(raw);
        jsonErrorEl.textContent = "";
        return { ok: true, payload };
      } catch (e) {
        const msg = `Invalid JSON: ${e.message}`;
        jsonErrorEl.textContent = msg;
        appendDebug(`JSON parse error: ${e.message}`);
        return { ok: false, error: msg };
      }
    }

    function addBatchRow(clientId, target, service) {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${clientId}</td><td>${target}</td><td>${service}</td>`;
      batchBodyEl.appendChild(row);
    }

    function normalizeDecisionPayload(json) {
      if (!json) {
        return null;
      }
      const target = (json.target || json.service || "").toString().toLowerCase();
      const location = json.location || json.url || "";
      if (!target || !location) {
        return null;
      }
      return {
        target,
        location,
        raw: json
      };
    }

    async function fetchDecision(clientId, op) {
      const decisionUrl = buildDecisionUrl(clientId, op);
      appendDebug(`decision url: ${decisionUrl}`);

      try {
        const response = await safeFetch(decisionUrl, { method: "GET" });
        appendDebug(`decision response.type=${response.type} status=${response.status}`);
        const text = await response.text();

        let json = null;
        try {
          json = text ? JSON.parse(text) : null;
        } catch (e) {
          return { ok: false, error: `Decision JSON parse error: ${e.message}` };
        }

        if (!response.ok) {
          return { ok: false, error: `Decision request failed: HTTP ${response.status} ${text}` };
        }

        const normalized = normalizeDecisionPayload(json);
        if (!normalized) {
          return { ok: false, error: "Decision response missing target/location (or service/url)" };
        }

        return {
          ok: true,
          response,
          decision: normalized,
          decisionUrl
        };
      } catch (e) {
        return { ok: false, error: `Network error: ${e.message}` };
      }
    }

    async function fetchService(location, op, payload) {
      const serviceUrl = buildServiceUrl(location, op);
      appendDebug(`service url: ${serviceUrl}`);

      try {
        const response = await safeFetch(serviceUrl, op === "echo" ? {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        } : {
          method: "GET"
        });

        appendDebug(`service response.type=${response.type} status=${response.status}`);
        const text = await response.text();

        let json = null;
        try {
          json = text ? JSON.parse(text) : null;
        } catch (e) {
          return { ok: false, error: `Service JSON parse error: ${e.message}`, serviceUrl };
        }

        if (!response.ok) {
          return { ok: false, error: `Service request failed: HTTP ${response.status} ${text}`, serviceUrl };
        }

        return {
          ok: true,
          response,
          data: json,
          serviceUrl
        };
      } catch (e) {
        return { ok: false, error: `Network error: ${e.message}`, serviceUrl };
      }
    }

    async function handleSend() {
      const clientId = clientIdEl.value.trim();
      const op = getOperation();

      if (!clientId) {
        step1El.textContent = "clientId is required";
        step2El.textContent = "Step2 skipped";
        return;
      }

      const payloadCheck = parsePayloadIfNeeded(op);
      if (!payloadCheck.ok) {
        step1El.textContent = payloadCheck.error;
        step2El.textContent = "Step2 skipped";
        return;
      }

      step1El.textContent = "Loading decision...";
      step2El.textContent = "Waiting for Step1...";
      setBadge(null);

      const decisionResult = await fetchDecision(clientId, op);
      if (!decisionResult.ok) {
        step1El.textContent = decisionResult.error;
        step2El.textContent = "Step2 skipped";
        return;
      }

      step1El.textContent =
        `status: ${decisionResult.response.status}\n` +
        `target: ${decisionResult.decision.target}\n` +
        `location: ${decisionResult.decision.location}\n\n` +
        JSON.stringify(decisionResult.decision.raw, null, 2);

      const serviceResult = await fetchService(decisionResult.decision.location, op, payloadCheck.payload);
      if (!serviceResult.ok) {
        step2El.textContent = serviceResult.error;
        setBadge(null);
        return;
      }

      const service = serviceResult.data && serviceResult.data.service ? serviceResult.data.service : "unknown";
      setBadge(service);
      step2El.textContent =
        `status: ${serviceResult.response.status}\n` +
        `url: ${serviceResult.serviceUrl}\n\n` +
        JSON.stringify(serviceResult.data, null, 2);
    }

    function handleOpenRealRedirect() {
      const clientId = clientIdEl.value.trim();
      const op = getOperation();

      if (!clientId) {
        step1El.textContent = "clientId is required";
        return;
      }

      const redirectUrl = buildRedirectUrl(clientId, op);
      appendDebug(`open redirect url: ${redirectUrl}`);
      window.location.href = redirectUrl;
    }

    async function handleBatch() {
      batchBodyEl.innerHTML = "";

      const op = getOperation();
      const payloadCheck = parsePayloadIfNeeded(op);
      if (!payloadCheck.ok) {
        step1El.textContent = payloadCheck.error;
        return;
      }

      for (let i = 0; i < 10; i += 1) {
        const clientId = Math.floor(Math.random() * 10) + 1;

        const decisionResult = await fetchDecision(clientId, op);
        if (!decisionResult.ok) {
          addBatchRow(clientId, "ERROR", decisionResult.error);
          continue;
        }

        const target = decisionResult.decision.target || "(none)";
        const serviceResult = await fetchService(decisionResult.decision.location, op, payloadCheck.payload);

        if (!serviceResult.ok) {
          addBatchRow(clientId, target, serviceResult.error);
          continue;
        }

        const service = serviceResult.data && serviceResult.data.service ? serviceResult.data.service : "ERROR";
        addBatchRow(clientId, target, service);
      }
    }

    operationEl.addEventListener("change", updateOperationUI);
    sendBtn.addEventListener("click", handleSend);
    openRedirectBtn.addEventListener("click", handleOpenRealRedirect);
    batchBtn.addEventListener("click", handleBatch);

    updateOperationUI();
    setBadge(null);
  </script>
</body>
</html>
